version: 1
backend:
  phases:
    build:
      commands:
        # npm ciではなくnpm installを使う。aws-cdk-lib等が同梱するbundled
        # dependencies(semver等)のバージョン整合性チェックがnpm ci側で
        # 誤検知し、package.jsonと矛盾しないlock fileでも失敗するため。
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
